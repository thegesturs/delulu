name = "delulu-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
CONVEX_URL = "https://giant-canary-837.convex.cloud"
DELULU_APP_URL = "https://solulu.delulu.social"
# Required for Clerk OAuth bearer token verification.
# Set production values with `wrangler secret put` or deployment environment vars.
CLERK_PUBLISHABLE_KEY = ""

# Secrets (set via wrangler secret put):
# CLERK_SECRET_KEY
# R2_ACCOUNT_ID
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY

[[kv_namespaces]]
binding = "DELULU_RATE_LIMIT_KV"
id = "0fa4faf775ec4ab28e259c8a5503dc3c"

[[r2_buckets]]
binding = "DELULU_SOCIAL_BUCKET"
bucket_name = "delulu-social"
