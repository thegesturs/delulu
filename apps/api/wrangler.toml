# Production API worker. The deployment name remains stable through cutover so
# existing secrets, Hyperdrive, KV, and rate-limit bindings stay attached.
name = "delulu-api-next"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

# Local `wrangler dev` server. Wrangler's default 8787 is frequently taken by
# other local services, so pin the dev port here. The app reaches this via
# NEXT_PUBLIC_API_URL (set in apps/app/.env.local for local dev).
[dev]
ip = "127.0.0.1"
port = 8788

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[triggers]
crons = ["* * * * *"]

[vars]
AS_ISSUER = "https://api.delulu.social"
API_RESOURCE = "https://api.delulu.social"
APP_BASE_URL = "https://solulu.delulu.social"
DODO_PAYMENTS_ENVIRONMENT = "live_mode"
# Public PostHog ingestion key (same client key shipped in the web/app bundles)
# and server-side product-analytics config. Not a secret.
POSTHOG_KEY = "phc_A5NWdEHAyUyzoUUSKnemshpamt3MCdbh9ztSxH0RvQV"
POSTHOG_HOST = "https://us.i.posthog.com"
ENVIRONMENT = "production"
CLERK_ISSUER = "https://clerk.delulu.social"
R2_BUCKET_NAME = "delulu-social"
R2_PUBLIC_BASE_URL = "https://media.delulu.social"
TWITTER_CALLBACK_URL = "https://api.delulu.social/v1/connections/callback/twitter"
LINKEDIN_CALLBACK_URL = "https://api.delulu.social/v1/connections/callback/linkedin"
TIKTOK_CALLBACK_URL = "https://api.delulu.social/v1/connections/callback/tiktok"
INSTAGRAM_CALLBACK_URL = "https://api.delulu.social/v1/connections/callback/instagram"
FACEBOOK_CALLBACK_URL = "https://api.delulu.social/v1/connections/callback/facebook"
PINTEREST_CALLBACK_URL = "https://api.delulu.social/v1/connections/callback/pinterest"
YOUTUBE_CALLBACK_URL = "https://api.delulu.social/v1/connections/callback/youtube"
THREADS_CALLBACK_URL = "https://api.delulu.social/v1/connections/callback/threads"
CLOUDFLARE_EMAIL_FROM = "notify@delulu.social"
CAL_RETENTION_EVENT_SLUG = "retention"

# Secrets (set via `wrangler secret put`):
#   CLERK_JWT_KEY     PEM public key for networkless Clerk verification
#   AS_SIGNING_KEY    PKCS#8 PEM ES256 private key for our AS
#   AS_SIGNING_KID    stable key id advertised in the JWKS
#   DATABASE_URL      local-dev fallback only (prod uses Hyperdrive)
#   CONNECTION_STATE_SECRET
#   CLERK_SECRET_KEY
#   R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
#   ENCRYPTION_SECRET
#   SQS_INGRESS_URL / SQS_INGRESS_SECRET
#   META_APP_SECRET / META_VERIFY_TOKEN
#   CLERK_WEBHOOK_SECRET / DODO_WEBHOOK_SECRET
#   DODO_PAYMENTS_API_KEY
#   TWITTER_CLIENT_ID / TWITTER_CLIENT_SECRET
#   LINKEDIN_CLIENT_ID / LINKEDIN_CLIENT_SECRET
#   TIKTOK_CLIENT_ID / TIKTOK_CLIENT_SECRET
#   INSTAGRAM_CLIENT_ID / INSTAGRAM_CLIENT_SECRET
#   FACEBOOK_CLIENT_ID / FACEBOOK_CLIENT_SECRET
#   PINTEREST_CLIENT_ID / PINTEREST_CLIENT_SECRET
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#   THREADS_CLIENT_ID / THREADS_CLIENT_SECRET
#   LOOPS_API_KEY
#   CAL_WEBHOOK_SECRET

[[send_email]]
name = "EMAIL"

# Postgres via Hyperdrive. In production `id` points at the real Hyperdrive
# config (fill after `wrangler hyperdrive create`). In local `wrangler dev`,
# Miniflare ignores `id` and runs its own Hyperdrive proxy against
# `localConnectionString`, keeping a warm connection pool. That warm pool is
# what makes local dev reliable: raw node-pg over `nodejs_compat` cold-opens a
# TCP socket per request, which workerd's hang-watchdog kills ("code had hung")
# under the parallel-request burst a page load produces. Routing Postgres
# through Hyperdrive locally mirrors prod and eliminates those transient 500s.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "d1629bb1372f441cb3fe7d870acf9ca3"
localConnectionString = "postgres://delulu:delulu@localhost:5432/delulu"

# One native Rate Limiting binding per distinct tier (static limit each).
[[unsafe.bindings]]
name = "RL_API_20"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
[[unsafe.bindings]]
name = "RL_API_60"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
[[unsafe.bindings]]
name = "RL_API_120"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 120, period = 60 }
[[unsafe.bindings]]
name = "RL_SESSION_300"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 300, period = 60 }

# Automation/session fast path and temporary multi-step OAuth state. Keys are
# namespaced by feature; Postgres remains authoritative.
[[kv_namespaces]]
binding = "AUTOMATION_KV"
id = "e4eecde6b80f429b94485436a905c864"

# Operational (30s) and provider-insights (1h) response cache.
[[kv_namespaces]]
binding = "EDGE_CACHE_KV"
id = "0fa4faf775ec4ab28e259c8a5503dc3c"
