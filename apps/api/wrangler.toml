# Staging-only worker for the backend revamp (M1). NEVER name this "delulu-api"
# until the M6 cutover — that name belongs to the production Hono worker in
# apps/api-legacy. Ids below are placeholders filled in at first provisioning
# (see README.md runbook). This config exists for `wrangler dev` + types only;
# no deploy happens until all milestones land (per user decision).
name = "delulu-api-next"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["* * * * *"]

[vars]
# Cutover deploy: replace the active staging pair below with these values just
# before attaching the production custom domain to this existing Worker.
# AS_ISSUER = "https://api.delulu.social"
# API_RESOURCE = "https://api.delulu.social"
AS_ISSUER = "https://api-next.delulu.social"
API_RESOURCE = "https://api-next.delulu.social"
APP_BASE_URL = "https://app.delulu.social"
DODO_PAYMENTS_ENVIRONMENT = "test_mode"
CLERK_ISSUER = ""
R2_BUCKET_NAME = "delulu-social"
R2_PUBLIC_BASE_URL = "https://media.delulu.social"

# Secrets (set via `wrangler secret put`):
#   CLERK_JWT_KEY     PEM public key for networkless Clerk verification
#   AS_SIGNING_KEY    PKCS#8 PEM ES256 private key for our AS
#   AS_SIGNING_KID    stable key id advertised in the JWKS
#   DATABASE_URL      local-dev fallback only (prod uses Hyperdrive)
#   CONNECTION_STATE_SECRET
#   CLERK_SECRET_KEY
#   R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
#   ENCRYPTION_SECRET
#   SQS_INGRESS_URL / SQS_INGRESS_SECRET
#   META_APP_SECRET / META_VERIFY_TOKEN
#   CLERK_WEBHOOK_SECRET / DODO_WEBHOOK_SECRET
#   DODO_PAYMENTS_API_KEY

# Postgres via Hyperdrive. In production `id` points at the real Hyperdrive
# config (fill after `wrangler hyperdrive create`). In local `wrangler dev`,
# Miniflare ignores `id` and runs its own Hyperdrive proxy against
# `localConnectionString`, keeping a warm connection pool. That warm pool is
# what makes local dev reliable: raw node-pg over `nodejs_compat` cold-opens a
# TCP socket per request, which workerd's hang-watchdog kills ("code had hung")
# under the parallel-request burst a page load produces. Routing Postgres
# through Hyperdrive locally mirrors prod and eliminates those transient 500s.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "delulu-local-dev-placeholder"
localConnectionString = "postgres://delulu:delulu@localhost:5432/delulu"

