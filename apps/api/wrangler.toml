# KV namespace for the monthly API-request counter (apiRequestsPerMonth budget).
# [[kv_namespaces]]
# binding = "API_USAGE_KV"
# id = "<kv-namespace-id>"

# M3 automation trigger/session fast path. Postgres remains authoritative and
# the minute Cron repairs missed or stale writes.
# [[kv_namespaces]]
# binding = "AUTOMATION_KV"
# id = "<automation-kv-namespace-id>"

# M4 operational (30s) and provider-insights (1h) response cache.
# [[kv_namespaces]]
# binding = "EDGE_CACHE_KV"
# id = "<edge-cache-kv-namespace-id>"
