name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: delulu
          POSTGRES_USER: delulu
          POSTGRES_PASSWORD: delulu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U delulu -d delulu"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://delulu:delulu@localhost:5432/delulu
      # SST/Pulumi types push tsc over the default ~2GB heap on GHA runners.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v4
        with: { version: 10.8.0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - name: Install dependencies
        env:
          HUGEICONS_TOKEN: ${{ secrets.HUGEICONS_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Install SST providers
        run: pnpm --filter=@delulu/infra exec sst install

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrate Postgres
        run: pnpm pg:migrate

      - name: Postgres integration tests
        run: pnpm --filter=@delulu/db test:integration

      - name: Migration lint
        run: pnpm pg:migration-lint

      - name: Connections boundary check
        run: pnpm check:connections-boundary
