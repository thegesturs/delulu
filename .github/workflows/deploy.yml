name: Deploy (prod)

# Auto-deploys the Cloudflare API worker + Next app and publishes the CLI on
# every push to main (and on demand). Ordering is load-bearing: the DB
# migration must land before the API worker rolls out, since the new code
# reads/writes columns the migration adds.
#
# Required repo/Environment secrets (Settings → Secrets → Actions, ideally
# scoped to the `production` Environment so deploys can require approval):
#   PROD_DATABASE_URL     – Postgres connection string for prod (migrations)
#   CLOUDFLARE_API_TOKEN  – token with Workers + Pages/Workers-Builds edit
#   CLOUDFLARE_ACCOUNT_ID – Cloudflare account id
#   HUGEICONS_TOKEN       – private Hugeicons Pro registry (apps/app install)
#   APP_ENV_PROD          – full contents of apps/app/.env.local for the build
#                           (Clerk publishable key, etc.); api URL defaults to
#                           https://api.delulu.social so most vars are optional
#   NPM_TOKEN             – npm automation token for publishing @delulu/cli
#
# The API worker's own secrets (AS_SIGNING_KEY, CLERK_JWT_KEY, …) live in
# Cloudflare via `wrangler secret put` and are NOT set here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two prod deploys race; queue them instead of cancelling.
  group: deploy-prod
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.8.0
  NODE_VERSION: "22"

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (db subgraph)
        run: pnpm install --frozen-lockfile --filter=@delulu/db...
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm pg:migrate

  deploy-api:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (api subgraph)
        run: pnpm install --frozen-lockfile --filter=@delulu/http-api...
      - name: Deploy worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy

  deploy-app:
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        env:
          HUGEICONS_TOKEN: ${{ secrets.HUGEICONS_TOKEN }}
        run: pnpm install --frozen-lockfile
      # next build inlines NEXT_PUBLIC_* at build time; opennextjs runs it.
      - name: Materialize app build env
        env:
          APP_ENV_PROD: ${{ secrets.APP_ENV_PROD }}
        run: printf '%s' "$APP_ENV_PROD" > apps/app/.env.local
      - name: Build & deploy app
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HUGEICONS_TOKEN: ${{ secrets.HUGEICONS_TOKEN }}
        run: pnpm run deploy

  publish-cli:
    # Independent of the worker deploys; only publishes when the version in
    # apps/cli/package.json is not already on npm, so re-runs are no-ops.
    needs: deploy-app
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install (cli subgraph)
        run: pnpm install --frozen-lockfile --filter=@delulu/cli...
      - name: Build CLI
        run: pnpm --filter=@delulu/cli build
      - name: Publish @delulu/cli and delulu-cli (if new version)
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@delulu/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@delulu/cli@$VERSION already published — skipping."
            exit 0
          fi
          # Primary scoped package.
          npm publish --access public
          # Defensive unscoped alias with identical contents.
          node -e "const fs=require('fs');const p=require('./package.json');p.name='delulu-cli';delete p.publishConfig;fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          npm publish --access public
          git checkout -- package.json
