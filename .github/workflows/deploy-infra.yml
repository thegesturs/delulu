name: Deploy Infra (SST)

# Deploys the AWS side of Delulu: the publishing queue, worker Lambda (bundles
# @delulu/connections/worker), SQS ingress, and transcription function —
# everything defined in
# packages/infrastructure/sst.config.ts.
#
# This does NOT deploy the Cloudflare API or app workers.

on:
  push:
    branches: [main]

concurrency:
  # SST state locks anyway; this keeps consecutive main pushes from running
  # production deploys concurrently. Finish the active deployment before
  # starting the next queued revision.
  group: deploy-infra-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Attach a GitHub Environment so you can require manual approval + scope the
    # OIDC secrets to production. Create it in Settings → Environments.
    environment: production
    permissions:
      id-token: write # required for AWS OIDC role assumption
      contents: read
    env:
      STAGE: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Scope install to infra's dependency subgraph (infra + workspace deps +
      # their externals). Skips apps/app, so the private Hugeicons Pro registry
      # never enters the install.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=@delulu/infra...

      # copyFiles in sst.config.ts bakes packages/worker/.env.prod into the
      # Lambda bundle. It is gitignored, so the deploy fails without this.
      # Store the file's full contents in the WORKER_ENV_PROD secret.
      - name: Materialize worker .env.prod
        env:
          WORKER_ENV_PROD: ${{ secrets.WORKER_ENV_PROD }}
        run: printf '%s' "$WORKER_ENV_PROD" > packages/worker/.env.prod

      # Fast gate: typecheck the two packages the Lambda actually bundles,
      # before touching AWS. Run per-package (not via turbo) to skip turbo's
      # transitive dep-task expansion, which includes an unrelated red
      # @delulu/typescript-config#typecheck and the composite-tsconfig noise in
      # @delulu/infra. SST bundles with esbuild and ignores tsc regardless.
      - name: Typecheck bundled packages
        run: |
          pnpm --filter=@delulu/connections typecheck
          pnpm --filter=@delulu/worker typecheck

      # Assume the deploy role via OIDC (no long-lived keys in CI).
      # Create an IAM role trusting token.actions.githubusercontent.com for this
      # repo, and set AWS_DEPLOY_ROLE_ARN as a repo/environment secret.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # The ubuntu-latest runner ships a pre-installed Pulumi language host that
      # conflicts with the engine SST v3 uses. Removing it prevents
      # "flag provided but not defined: -root" from /usr/local/bin/pulumi-language-nodejs.
      - name: Remove runner's conflicting Pulumi
        run: |
          sudo rm -rf /usr/local/bin/pulumi /usr/local/bin/pulumi-* /opt/pulumi 2>/dev/null || true
          echo "remaining pulumi on PATH: $(command -v pulumi || echo none)"

      - name: SST deploy
        working-directory: packages/infrastructure
        run: pnpm sst deploy --stage "$STAGE"
