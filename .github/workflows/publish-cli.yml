name: Publish CLI

# Publishes the CLI to npm as delulu-cli whenever the version in
# apps/cli/package.json is new. The api/app/web workers deploy via Cloudflare's
# own git integration — this workflow only handles the npm package.
#
# Auth is npm Trusted Publishing (OIDC) — NO token/secret is stored or rotated.
# One-time setup on npmjs.com: package delulu-cli -> Settings -> Trusted
# Publisher -> GitHub Actions, repo `thegesturs/delulu`, workflow
# `publish-cli.yml`, environment `production`. (The package must exist first;
# do the initial `npm publish` once locally, then OIDC handles every release.)

on:
  push:
    branches: [main]
    # Only bother when the CLI or something it bundles changes.
    paths:
      - "apps/cli/**"
      - "packages/client/**"
      - "packages/core/**"
  workflow_dispatch:

concurrency:
  group: publish-cli
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.8.0
  NODE_VERSION: "22"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      # Required for npm Trusted Publishing (OIDC).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted Publishing needs npm >= 11.5.1 (Node 22 ships npm 10.x).
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest
      # Install only the public CLI dependency subgraph.
      - name: Install (cli subgraph)
        run: pnpm install --frozen-lockfile --filter=delulu-cli...
      - name: Build CLI
        run: pnpm --filter=delulu-cli build
      - name: Publish delulu-cli (if new version)
        working-directory: apps/cli
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "delulu-cli@$VERSION" version >/dev/null 2>&1; then
            echo "delulu-cli@$VERSION already published — nothing to do."
            exit 0
          fi
          # OIDC (no token): npm authenticates via the id-token above. Do not
          # force provenance here: npm does not support provenance attestations
          # when the workflow's source repository is private.
          npm publish --access public
