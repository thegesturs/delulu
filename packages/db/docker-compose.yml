services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: delulu
      POSTGRES_USER: delulu
      POSTGRES_PASSWORD: delulu
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delulu -d delulu"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - delulu-postgres:/var/lib/postgresql
volumes:
  delulu-postgres:
