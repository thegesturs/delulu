name: delulu

x-runtime-environment: &runtime-environment
  DATABASE_URL: postgres://delulu:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/delulu
  DELULU_DEPLOYMENT_MODE: self_hosted
  DELULU_PUBLISH_TRANSPORT: postgres
  DELULU_REGISTRATION_ENABLED: ${DELULU_REGISTRATION_ENABLED:-true}
  DELULU_VERSION: ${DELULU_VERSION:-development}
  DELULU_COMMUNITY_API_RATE_PER_MINUTE: ${DELULU_COMMUNITY_API_RATE_PER_MINUTE:-120}
  APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
  CLERK_ISSUER: ${CLERK_ISSUER:?set CLERK_ISSUER}
  CLERK_JWT_KEY: ${CLERK_JWT_KEY:?set CLERK_JWT_KEY}
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
  CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
  AS_SIGNING_KEY_BASE64: ${AS_SIGNING_KEY_BASE64:?set AS_SIGNING_KEY_BASE64}
  AS_SIGNING_KID: ${AS_SIGNING_KID:-delulu-self-hosted}
  ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?set ENCRYPTION_SECRET}
  CONNECTION_STATE_SECRET: ${CONNECTION_STATE_SECRET:?set CONNECTION_STATE_SECRET}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?set R2_ACCOUNT_ID}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY}
  R2_BUCKET_NAME: ${R2_BUCKET_NAME:?set R2_BUCKET_NAME}
  R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:?set R2_PUBLIC_BASE_URL}
  TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
  TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}
  TWITTER_CALLBACK_URL: ${TWITTER_CALLBACK_URL:-}
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
  LINKEDIN_CALLBACK_URL: ${LINKEDIN_CALLBACK_URL:-}
  TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
  TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
  TIKTOK_CALLBACK_URL: ${TIKTOK_CALLBACK_URL:-}
  INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
  INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
  INSTAGRAM_CALLBACK_URL: ${INSTAGRAM_CALLBACK_URL:-}
  FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
  FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
  FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-}
  PINTEREST_CLIENT_ID: ${PINTEREST_CLIENT_ID:-}
  PINTEREST_CLIENT_SECRET: ${PINTEREST_CLIENT_SECRET:-}
  PINTEREST_CALLBACK_URL: ${PINTEREST_CALLBACK_URL:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  YOUTUBE_CALLBACK_URL: ${YOUTUBE_CALLBACK_URL:-}
  THREADS_CLIENT_ID: ${THREADS_CLIENT_ID:-}
  THREADS_CLIENT_SECRET: ${THREADS_CLIENT_SECRET:-}
  THREADS_CALLBACK_URL: ${THREADS_CALLBACK_URL:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}

x-app-build: &app-build
  context: ../..
  dockerfile: deploy/self-host/Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: delulu
      POSTGRES_USER: delulu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delulu -d delulu"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      <<: *app-build
      target: migrate
    environment: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      <<: *app-build
      target: api
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      PORT: 8787
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/v1/instance').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12

  publisher:
    build:
      <<: *app-build
      target: publisher
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      PUBLISH_CONCURRENCY: ${PUBLISH_CONCURRENCY:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  app:
    build:
      <<: *app-build
      target: app
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(r.status>=500)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
